name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # On a release the tag (v1.2.3) is the source of truth; on a manual run
      # from a branch the version comes from package.json.
      - name: Sync server.json version with release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "Publishing version: $VERSION"
          VERSION="$VERSION" node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            const s = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            s.version = version;
            for (const p of s.packages || []) p.version = version;
            fs.writeFileSync('server.json', JSON.stringify(s, null, 2) + '\n');
          "
          cat server.json

      # The registry verifies ownership through the mcpName field of the
      # published npm package, so the version has to be on npm first.
      - name: Wait for npm package to be available
        run: |
          VERSION=$(node -p "require('./server.json').version")
          echo "Waiting for pixelforge-mcp@$VERSION on npm..."
          for i in $(seq 1 60); do
            if npm view "pixelforge-mcp@$VERSION" version 2>/dev/null | grep -q "^$VERSION$"; then
              echo "Package available."
              exit 0
            fi
            echo "Not yet (attempt $i/60), sleeping 10s..."
            sleep 10
          done
          echo "Timed out waiting for npm package."
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Login to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
